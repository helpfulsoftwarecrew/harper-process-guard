name: Publish

on:
  # A hand-pushed v* tag is the only publish trigger; a merge alone ships nothing.
  push:
    tags: ['v*']

# The default for every job, including the reusable test call, which otherwise runs on the repo default
# token grant; the publish job re-elevates id-token in its own block, where the registry needs it.
permissions:
  contents: read

# Deleting and re-pushing a tag while a run is still live must queue behind it, not interleave around
# the npm publish step.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same workflow that gates every branch push, called whole, so a tag cannot publish on weaker checks than a PR merges on.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    # An npm ci and a publish; the margin is for a runner that never schedules.
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing exchanges this OIDC token for a credential that can publish and nothing else,
      # and provenance is signed from it. No npm token reaches this job.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          # No registry-url: it writes an .npmrc that reads NODE_AUTH_TOKEN and sets a placeholder token when none
          # is given, and the OIDC exchange needs neither. npm's default registry is the one this publishes to.

      - name: Install dependencies
        run: npm ci

      # A pause on publishing is spelled `"private": true` in the manifest; this step is what makes that spelling stick.
      - name: Refuse to publish while package.json says private
        run: |
          node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            if (manifest.private) {
              console.log("::error::package.json still carries \"private\": true, so publishing is refused. Remove the flag once the package is ready to ship, then re-tag.");
              process.exit(1);
            }
          '

      # A tag naming one version while the manifest carries another would ship the wrong bits under a traceable name.
      - name: Refuse a tag that disagrees with package.json
        run: |
          node -e '
            const { version } = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${version}`) {
              console.log(`::error::Tag ${tag} does not match package.json version ${version}. Bump the version or move the tag so the two agree, then push the tag again.`);
              process.exit(1);
            }
          '

      # Only stable versions ship; a version that carries a prerelease suffix is refused before anything is published.
      - name: Refuse a prerelease version
        run: |
          node -e '
            const { version } = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
            if (version.includes("-")) {
              console.log(`::error::Version ${version} is a prerelease, and this package publishes stable versions only. Set a version with no "-" suffix in package.json, then re-tag.`);
              process.exit(1);
            }
          '

      # npm publishes through OIDC from 11.5.1 on; an older one finds no token and fails as ENEEDAUTH, which reads as a
      # registry fault rather than a version to bump.
      - name: Refuse an npm too old for trusted publishing
        run: |
          required=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
            echo "::error::npm $have cannot publish through OIDC trusted publishing, which needs $required or later. Raise the node-version this job sets up."
            exit 1
          fi

      # The dist-tag is chosen before the publish, since the OIDC credential covers npm publish and not npm dist-tag:
      # a version newer than the registry's latest, or a package's first, goes under latest, and a patch to an older
      # line goes under release-<major>.<minor>, which the publish creates or moves. Only a 404 reads as no latest; any
      # other failure to read it fails the job, so a patch to an old line cannot take latest on a registry hiccup.
      - name: Choose the dist-tag
        id: dist
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          err="${RUNNER_TEMP:-/tmp}/npm-view-latest.err"
          if current="$(npm view "$name" dist-tags.latest 2>"$err")"; then
            :
          elif grep -q E404 "$err"; then
            current=''
          else
            cat "$err"
            echo "::error::The latest dist-tag of $name could not be read, so no dist-tag can be chosen for $version. Re-run the job."
            exit 1
          fi
          # sort -V ranks 2.0.0-beta.1 above 2.0.0, so it only ever compares two stable versions here; a latest that
          # names a prerelease is one a stable version replaces.
          tag=latest
          case "$current" in
            '' | *-*) ;;
            *)
              if [ "$current" != "$version" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" = "$current" ]; then
                tag="release-$(printf '%s' "$version" | cut -d. -f1,2)"
              fi
              ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Publishing $name@$version under the $tag dist-tag; the registry's latest is ${current:-unset}."

      # A version already on the registry is skipped. `npm view` reads the packument, which can trail a publish
      # by more than 20 minutes, so a re-run inside that window can still fail and a later one finishes.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "$name@$version is already on the registry, so this run publishes nothing."
            exit 0
          fi
          npm publish --access public --tag "$DIST_TAG"
